<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>湯の音旅館 — 多言語コンシェルジュ（デモ）</title>
<style>
:root{
  --ink:#241f1c; --ink-2:#5b524c; --ink-3:#8d837c;
  --paper:#f7f4ef; --card:#fffdfa; --line:#e3dbd1;
  --indigo:#2f4858; --indigo-soft:#e8eef1;
  --accent:#8c6239; --accent-soft:#f3ece3;
  --warn:#a8442a; --warn-soft:#fbeeea;
  --ok:#3f6b4f; --ok-soft:#ecf3ee;
  --shadow:0 1px 2px rgba(36,31,28,.06),0 8px 24px rgba(36,31,28,.07);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Meiryo","メイリオ","Malgun Gothic","맑은 고딕","Hiragino Sans",
              "Noto Sans JP","Yu Gothic UI",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.75; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--paper);
     box-shadow:0 0 60px rgba(36,31,28,.07);position:relative;padding-bottom:88px}

/* ── demo badge ─────────────────────────── */
.demo-bar{background:var(--indigo);color:#f2f6f8;font-size:11px;letter-spacing:.06em;
  text-align:center;padding:6px 12px;position:sticky;top:0;z-index:50}
.demo-bar b{font-weight:700}

/* ── header ─────────────────────────────── */
header{padding:20px 20px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mark{font-size:11px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
h1{margin:2px 0 0;font-size:19px;font-weight:700;letter-spacing:.02em}
.sub{margin:4px 0 0;font-size:12px;color:var(--ink-3)}
.langs{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;
  transition:.15s}
.lang:hover{border-color:var(--accent)}
.lang[aria-pressed="true"]{background:var(--indigo);color:#fff;border-color:var(--indigo)}

/* ── screens ────────────────────────────── */
main{padding:18px 16px 24px}
.screen{display:none;animation:fade .28s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.lead{font-size:13px;color:var(--ink-2);margin:0 0 16px}

/* ── tiles ──────────────────────────────── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 14px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
  box-shadow:var(--shadow);transition:.15s;display:flex;flex-direction:column;gap:8px;min-height:112px}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile .ic{font-size:22px;line-height:1}
.tile .t{font-size:14px;font-weight:700;line-height:1.4}
.tile .d{font-size:11px;color:var(--ink-3);line-height:1.5}

/* ── generic card ───────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:700}
.card h3{margin:16px 0 6px;font-size:12px;font-weight:700;color:var(--ink-3);
  letter-spacing:.08em;text-transform:uppercase}

/* ── back ───────────────────────────────── */
.back{background:none;border:none;color:var(--ink-3);font-size:13px;cursor:pointer;
  padding:0 0 12px;font-family:inherit;display:flex;align-items:center;gap:6px}
.back:hover{color:var(--accent)}

/* ── buttons ────────────────────────────── */
.btn{width:100%;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:.15s}
.btn-primary{background:var(--indigo);color:#fff}
.btn-primary:hover{background:#22353f}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-2);font-weight:400;font-size:14px}
.btn-ghost:hover{border-color:var(--accent)}
.btn+.btn{margin-top:8px}

/* ── the "board" (温泉分析書) ───────────── */
.board{background:#efeae1;border:1px solid #d6ccbe;border-radius:8px;padding:14px 14px 12px;
  font-size:11px;line-height:1.85;color:#3a332d;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 40%);pointer-events:none}
.board .bt{text-align:center;font-weight:700;font-size:13px;letter-spacing:.3em;
  border-bottom:1px solid #c9bfae;padding-bottom:7px;margin-bottom:9px}
.board dl{margin:0;display:grid;grid-template-columns:74px 1fr;gap:3px 8px}
.board dt{color:#7a6f61}
.board dd{margin:0}
.board .note{margin-top:8px;padding-top:7px;border-top:1px dashed #c9bfae;color:#7a6f61;font-size:10px}

/* ── scanning ───────────────────────────── */
.scanwrap{position:relative}
.scanline{position:absolute;left:0;right:0;height:2px;background:var(--accent);
  box-shadow:0 0 12px 2px rgba(140,98,57,.5);animation:scan 1.1s ease-in-out infinite;border-radius:2px}
@keyframes scan{0%{top:4%}50%{top:94%}100%{top:4%}}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin-top:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* ── result rows ────────────────────────── */
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0}
.orig{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--indigo-soft);
  color:var(--indigo);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* ── verdicts ───────────────────────────── */
.verdict{border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid;display:flex;gap:11px}
.verdict .vi{font-size:18px;line-height:1.3;flex-shrink:0}
.verdict .vt{font-size:14px;font-weight:700;margin:0 0 3px}
.verdict .vd{font-size:12.5px;line-height:1.65;margin:0}
.v-warn{background:var(--warn-soft);border-color:#e8c4b8;color:#7d3320}
.v-ok{background:var(--ok-soft);border-color:#c4d8ca;color:#2e5a3d}
.v-info{background:var(--indigo-soft);border-color:#c8d6dd;color:#26404e}

/* ── condition toggles ──────────────────── */
.conds{display:flex;flex-wrap:wrap;gap:7px}
.cond{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--ink-2);transition:.15s}
.cond:hover{border-color:var(--accent)}
.cond[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── steps ──────────────────────────────── */
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;padding:12px 0 12px 40px;border-bottom:1px solid var(--line);
  position:relative;font-size:13.5px;line-height:1.65}
.steps li:last-child{border-bottom:none}
.steps li::before{content:counter(s);position:absolute;left:0;top:12px;width:25px;height:25px;
  border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.steps b{display:block;font-size:13.5px;margin-bottom:1px}
.steps span{color:var(--ink-3);font-size:12px}

/* ── QA ─────────────────────────────────── */
.qa{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px;background:var(--card)}
.qa summary{padding:13px 14px;cursor:pointer;font-size:13.5px;font-weight:700;list-style:none;
  display:flex;justify-content:space-between;gap:10px;align-items:center}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"＋";color:var(--ink-3);font-size:14px;flex-shrink:0}
.qa[open] summary::after{content:"−"}
.qa .ans{padding:0 14px 14px;font-size:13px;color:var(--ink-2);line-height:1.75;
  border-top:1px solid var(--line);padding-top:12px;margin-top:-1px}

/* ── disclaimer ─────────────────────────── */
.disc{font-size:11px;color:var(--ink-3);line-height:1.7;background:var(--card);
  border:1px dashed var(--line);border-radius:10px;padding:11px 13px;margin-top:14px}

/* ── bottom nav ─────────────────────────── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:40}
.nav button{background:none;border:none;font-family:inherit;cursor:pointer;color:var(--ink-3);
  font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px}
.nav button .ni{font-size:17px;line-height:1}
.nav button[aria-pressed="true"]{color:var(--accent);font-weight:700}
footer{padding:16px;text-align:center;font-size:10.5px;color:var(--ink-3);line-height:1.7}
</style>
</head>
<body>
<div class="app">

  <div class="demo-bar"><b id="demoBadge">デモ版</b> — <span id="demoNote">AIの応答はサンプル固定です（実機はライブ生成）</span></div>

  <header>
    <div class="brandrow">
      <div>
        <div class="mark">Onsen Concierge</div>
        <h1 id="hTitle">湯の音旅館</h1>
        <p class="sub" id="hSub">客室QRからご案内しています（架空の施設です）</p>
      </div>
    </div>
    <div class="langs" id="langs"></div>
  </header>

  <main>
    <!-- HOME -->
    <section class="screen on" id="s-home">
      <p class="lead" id="homeLead"></p>
      <div class="tiles" id="tiles"></div>
      <div class="disc" id="homeDisc"></div>
    </section>

    <!-- ANALYSIS -->
    <section class="screen" id="s-scan">
      <button class="back" data-go="home">← <span data-t="back"></span></button>
      <div class="card">
        <h2 data-t="scanTitle"></h2>
        <p class="lead" style="margin-bottom:14px" data-t="scanLead"></p>
        <div class="scanwrap" id="scanwrap">
          <div class="board" id="board"></div>
        </div>
        <div id="scanStatus"></div>
        <button class="btn btn-primary" id="btnScan" style="margin-top:14px" data-t="scanBtn"></button>
      </div>
      <div id="scanResult"></div>
    </section>

    <!-- TATTOO -->
    <section class="screen" id="s-tattoo">
      <button class="back" data-go="home">← <span data-t="back"></span></button>
      <div id="tattooBody"></div>
    </section>

    <!-- MANNERS -->
    <section class="screen" id="s-manner">
      <button class="back" data-go="home">← <span data-t="back"></span></button>
      <div class="card">
        <h2 data-t="mannerTitle"></h2>
        <ol class="steps" id="mannerSteps"></ol>
      </div>
      <div id="mannerNg"></div>
    </section>

    <!-- FACILITY -->
    <section class="screen" id="s-info">
      <button class="back" data-go="home">← <span data-t="back"></span></button>
      <div class="card"><h2 data-t="infoTitle"></h2>
        <p class="lead" style="margin:0" data-t="infoLead"></p></div>
      <div id="infoQa"></div>
    </section>

    <!-- PROFILE -->
    <section class="screen" id="s-me">
      <button class="back" data-go="home">← <span data-t="back"></span></button>
      <div class="card">
        <h2 data-t="meTitle"></h2>
        <p class="lead" data-t="meLead"></p>
        <div class="conds" id="conds"></div>
      </div>
      <div class="disc" data-t="meDisc"></div>
    </section>
  </main>

  <nav class="nav" id="nav"></nav>
  <footer id="foot"></footer>
</div>

<script>
"use strict";

/* ============================================================
   湯の音旅館 — 多言語温泉コンシェルジュ（営業デモ）
   ・API不要 / 完全オフライン動作。商談中にネットが落ちても止まらない。
   ・分析結果は固定サンプル。本番は Claude Vision で実写を構造化する。
   ・施設は架空。実在の旅館の情報は一切含まない。
   ============================================================ */

/* ---- 温泉分析書（架空・様式は温泉法第18条の掲示義務項目に準拠） ---- */
const BOARD = {
  source:"湯の音源泉 １号井",
  quality:"単純硫黄温泉（硫化水素型・低張性アルカリ性高温泉）",
  temp:"58.2 ℃",
  ph:"8.4",
  yield:"毎分 210 L（自噴）",
  date:"令和7年4月11日 分析",
  indications:["神経痛","筋肉痛","関節痛","五十肩","慢性皮膚病","アトピー性皮膚炎","冷え性","疲労回復","糖尿病"],
  contra:["急性疾患","活動性の結核","悪性腫瘍","重い心臓病","呼吸不全","腎不全","出血性疾患","高度の貧血","妊娠中（特に初期と末期）","皮膚・粘膜の過敏な方"],
  treatment:{ water:"あり（源泉が高温のため）", heat:"なし", circ:"なし（かけ流し）", disinfect:"なし" }
};

/* ---- 施設のタトゥー方針（架空）---- */
const TATTOO = { policy:"conditional", coverSize:"12cm × 8cm", privateBath:"無料・予約制（45分）" };

/* ---- 掲示用語の対訳 --------------------------------------------
   本番では Claude が抽出と同時に訳す。デモでは辞書で固定。
   環境省の泉質10分類・一般的適応症/禁忌症は語彙が閉じているため、
   実装上も「よく出る語は辞書、それ以外はモデル訳」の併用が現実的。
   ---------------------------------------------------------------- */
const TERMS = {
  "神経痛":            {ko:"신경통",              en:"Neuralgia",                     zh:"神經痛"},
  "筋肉痛":            {ko:"근육통",              en:"Muscle pain",                   zh:"肌肉痠痛"},
  "関節痛":            {ko:"관절통",              en:"Joint pain",                    zh:"關節痛"},
  "五十肩":            {ko:"오십견",              en:"Frozen shoulder",               zh:"五十肩"},

  "アトピー性皮膚炎":  {ko:"아토피성 피부염",     en:"Atopic dermatitis",             zh:"異位性皮膚炎"},
  "冷え性":            {ko:"냉증",                en:"Poor circulation",              zh:"手腳冰冷"},
  "疲労回復":          {ko:"피로 회복",           en:"Fatigue recovery",              zh:"消除疲勞"},
  "糖尿病":            {ko:"당뇨병",              en:"Diabetes",                      zh:"糖尿病"},
  "急性疾患":          {ko:"급성 질환",           en:"Acute illness",                 zh:"急性疾病"},
  "活動性の結核":      {ko:"활동성 결핵",         en:"Active tuberculosis",           zh:"活動性結核"},
  "悪性腫瘍":          {ko:"악성 종양",           en:"Malignant tumours",             zh:"惡性腫瘤"},
  "重い心臓病":        {ko:"중증 심장병",         en:"Serious heart disease",         zh:"嚴重心臟病"},
  "呼吸不全":          {ko:"호흡부전",            en:"Respiratory failure",           zh:"呼吸衰竭"},
  "腎不全":            {ko:"신부전",              en:"Kidney failure",                zh:"腎衰竭"},
  "出血性疾患":        {ko:"출혈성 질환",         en:"Haemorrhagic disorders",        zh:"出血性疾病"},
  "高度の貧血":        {ko:"고도 빈혈",           en:"Severe anaemia",                zh:"重度貧血"},
  "妊娠中（特に初期と末期）":
                       {ko:"임신 중(특히 초기와 말기)", en:"Pregnancy (esp. early and late)", zh:"懷孕中（尤其初期與末期）"},
  "皮膚・粘膜の過敏な方":
                       {ko:"피부·점막이 과민한 분",     en:"Sensitive skin or mucous membranes", zh:"皮膚、黏膜過敏者"},

  "単純硫黄温泉（硫化水素型・低張性アルカリ性高温泉）":
    {ko:"단순 유황천 (황화수소형 · 저장성 알칼리성 고온천)",
     en:"Simple sulphur spring (hydrogen-sulphide type, hypotonic, alkaline, high-temp.)",
     zh:"單純硫磺泉（硫化氫型・低張性鹼性高溫泉）"},
  "毎分 210 L（自噴）":
    {ko:"분당 210 L (자연 용출)", en:"210 L/min (natural flow)", zh:"每分 210 L（自然湧出）"},
  "あり（源泉が高温のため）":
    {ko:"있음 (원천이 고온이라서)", en:"Yes (source water is very hot)", zh:"有（因源泉高溫）"},
  "なし":              {ko:"없음",                en:"No",                            zh:"無"},
  "なし（かけ流し）":  {ko:"없음 (전량 흘려보냄)", en:"No (free-flowing)",            zh:"無（掛流）"}
};
/* 訳語を返す。日本語表示時と未登録語はそのまま返す。 */
const tr = s => (lang==="ja" ? s : ((TERMS[s]||{})[lang] || s));
/* 掲示板の前に立っている人が原文と照合できるよう、原語を小さく併記する。 */
const orig = s => (lang==="ja" ? "" : `<span class="orig">${esc(s)}</span>`);

/* ---- 利用者の条件 ---- */
const CONDITIONS = [
  {id:"hbp",     hits:["禁忌注意"]},
  {id:"heart",   hits:["医師相談"]},
  {id:"preg",    hits:["医師相談"]},
  {id:"tattoo",  hits:["施設方針"]},
  {id:"atopy",   hits:["適応"]},
  {id:"diabetes",hits:["適応"]},
  {id:"baby",    hits:["施設方針"]},
  {id:"sensitive",hits:["禁忌注意"]}
];

/* ============================================================
   多言語辞書
   ============================================================ */
const I18N = {

  name:"日本語", badge:"デモ版",
  demoNote:"AIの応答はサンプル固定です（実機はライブ生成）",

  homeLead:"ようこそ。お風呂のこと、館内のこと、なんでもお尋ねください。母国語でお答えします。",
  back:"戻る",
  nav:["ホーム","わたしの条件","館内案内"],
  tiles:[
    {k:"scan",   ic:"♨",  t:"温泉分析書を読む",  d:"入口の掲示を撮影 → 母国語で解説"},
    {k:"tattoo", ic:"◆",  t:"タトゥーは入れる？", d:"当館の方針をご確認いただけます"},
    {k:"manner", ic:"◇",  t:"入浴の作法",        d:"初めての方へ・6ステップ"},
    {k:"info",   ic:"○",  t:"館内のご案内",      d:"食事・送迎・アメニティ"}
  ],
  homeDisc:"※ 本アプリは掲示内容の翻訳・整理を行うものであり、医学的な診断ではありません。体調に不安のある方は医師にご相談ください。",
  scanTitle:"温泉分析書を読む",
  scanLead:"浴場入口に掲示されている分析書です。撮影すると、お客様が登録された条件と照らし合わせてご説明します。",
  scanBtn:"この掲示を読み取る", scanAgain:"もう一度読み取る",
  scanning:"分析書を読み取っています…",
  scanSteps:["文字を認識しています","泉質・適応症・禁忌症を抽出しています","お客様の条件と照合しています"],
  resTitle:"読み取り結果",
  lbl:{source:"源泉名",quality:"泉質",temp:"泉温",ph:"pH",yield:"湧出量",
       ind:"適応症",con:"禁忌症",treat:"温泉の処理"},

/* ============================================================
   状態
   ============================================================ */
let lang = "ja";
let picked = new Set();
let scanned = false;

const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const T  = ()=> I18N[lang];
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- 言語ボタン ---- */
function buildLangs(){
  $("#langs").innerHTML = Object.keys(I18N).map(k=>
    `<button class="lang" data-lang="${k}" aria-pressed="${k===lang}">${esc(I18N[k].name)}</button>`
  ).join("");
}

/* ---- 画面遷移 ---- */
function go(id){
  $$(".screen").forEach(s=>s.classList.toggle("on", s.id==="s-"+id));
  $$("#nav button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.go===id));
  window.scrollTo({top:0,behavior:"instant"});
}

/* ---- 分析書ボード ---- */
function renderBoard(){
  const t=T();
  $("#board").innerHTML =
    `<div class="bt">温泉分析書</div>
     <dl>
       <dt>源泉名</dt><dd>${esc(BOARD.source)}</dd>
       <dt>泉質</dt><dd>${esc(BOARD.quality)}</dd>
       <dt>泉温</dt><dd>${esc(BOARD.temp)}／pH ${esc(BOARD.ph)}</dd>
       <dt>適応症</dt><dd>${esc(BOARD.indications.join("、"))}</dd>
       <dt>禁忌症</dt><dd>${esc(BOARD.contra.join("、"))}</dd>
       <dt>処理</dt><dd>加水${esc(BOARD.treatment.water)}／加温${esc(BOARD.treatment.heat)}／循環${esc(BOARD.treatment.circ)}／消毒${esc(BOARD.treatment.disinfect)}</dd>
     </dl>
     <div class="note">${esc(BOARD.date)}　温泉法第18条に基づく掲示</div>`;
}

/* ---- 読み取り（デモ：固定サンプルを段階表示）---- */
function runScan(){
  const t=T(), btn=$("#btnScan"), wrap=$("#scanwrap");
  if(btn.disabled) return;          // 実行中の二度押しだけを弾く
  scanned = false;                  // 何度でも読み直せる（営業で繰り返し見せるため）
  $("#scanResult").innerHTML = "";
  btn.disabled = true; btn.style.opacity=".5";
  wrap.insertAdjacentHTML("beforeend",'<div class="scanline" id="sl"></div>');

  let i = 0;
  const tick = ()=>{
    if(i < t.scanSteps.length){
      $("#scanStatus").innerHTML =
        `<div class="status"><span class="dot"></span><span>${esc(t.scanSteps[i])}</span></div>`;
      i++; setTimeout(tick, 850);
    } else {
      const sl=$("#sl"); if(sl) sl.remove();
      $("#scanStatus").innerHTML="";
      btn.disabled=false; btn.style.opacity="1";
      btn.textContent = t.scanAgain;
      scanned = true;
      renderResult();
      // smooth は環境によって効かないことがあるため即時スクロールにする
      $("#scanResult").scrollIntoView({block:"start"});
    }
  };
  tick();
}

/* ---- 読み取り結果 + 条件照合 ---- */
function renderResult(){
  const t=T(), L=t.lbl, TL=t.treatLbl, t2=BOARD.treatment;

  const verdicts = [];
  CONDITIONS.forEach(c=>{ if(picked.has(c.id) && t.vd[c.id]) verdicts.push({id:c.id, ...t.vd[c.id]}); });

  const severe = new Set(["heart","preg"]);
  const good   = new Set(["atopy","diabetes"]);
  const vHtml = verdicts.length
    ? verdicts.map(v=>{
        const cls = severe.has(v.id) ? "v-warn" : good.has(v.id) ? "v-ok" : "v-info";
        const ic  = severe.has(v.id) ? "!" : good.has(v.id) ? "✓" : "·";
        return `<div class="verdict ${cls}"><div class="vi">${ic}</div>
                <div><p class="vt">${esc(v.t)}</p><p class="vd">${esc(v.d)}</p></div></div>`;
      }).join("")
    : (picked.size
        ? `<div class="verdict v-ok"><div class="vi">✓</div><div>
             <p class="vt">${esc(t.okNone.t)}</p><p class="vd">${esc(t.okNone.d)}</p></div></div>`
        : `<div class="verdict v-info"><div class="vi">·</div><div>
             <p class="vd">${esc(t.noCond)}</p></div></div>
           <button class="btn btn-ghost" data-go="me">${esc(t.goCond)}</button>`);

  $("#scanResult").innerHTML =
    `<div class="card">
      <h2>${esc(t.resTitle)}</h2>
      <dl class="kv">
        <dt>${esc(L.source)}</dt><dd>${esc(BOARD.source)}</dd>
        <dt>${esc(L.quality)}</dt><dd>${esc(tr(BOARD.quality))}${orig(BOARD.quality)}</dd>
        <dt>${esc(L.temp)}</dt><dd>${esc(BOARD.temp)}</dd>
        <dt>${esc(L.ph)}</dt><dd>${esc(BOARD.ph)}</dd>
        <dt>${esc(L.yield)}</dt><dd>${esc(tr(BOARD.yield))}</dd>
      </dl>
      <h3>${esc(L.ind)}</h3>
      <div class="chips">${BOARD.indications.map(x=>`<span class="chip ok">${esc(tr(x))}</span>`).join("")}</div>
      <h3>${esc(L.con)}</h3>
      <div class="chips">${BOARD.contra.map(x=>`<span class="chip warn">${esc(tr(x))}</span>`).join("")}</div>
      <h3>${esc(L.treat)}</h3>
      <div class="chips">
        <span class="chip">${esc(TL.water)}：${esc(tr(t2.water))}</span>
        <span class="chip">${esc(TL.heat)}：${esc(tr(t2.heat))}</span>
        <span class="chip">${esc(TL.circ)}：${esc(tr(t2.circ))}</span>
        <span class="chip">${esc(TL.disinfect)}：${esc(tr(t2.disinfect))}</span>
      </div>
    </div>
    <div class="card">${vHtml}</div>
    <div class="disc">${esc(t.homeDisc)}</div>`;
}

/* ---- タトゥー ---- */
function renderTattoo(){
  const t=T();
  $("#tattooBody").innerHTML =
    `<div class="card">
       <h2>${esc(t.tattooTitle)}</h2>
       <p class="lead" style="margin-bottom:14px">${esc(t.tattooLead)}</p>
       <div class="verdict v-ok"><div class="vi">✓</div><div>
         <p class="vt">${esc(t.tattooCond.t)}</p>
         <p class="vd">${esc(t.tattooCond.d.replace("{s}", TATTOO.coverSize))}</p></div></div>
       <div class="verdict v-info"><div class="vi">·</div><div>
         <p class="vt">${esc(t.tattooAlt.t)}</p>
         <p class="vd">${esc(t.tattooAlt.d.replace("{p}", TATTOO.privateBath))}</p></div></div>
     </div>
     <div class="disc">${esc(t.tattooNote)}</div>`;
}

/* ---- マナー ---- */
function renderManner(){
  const t=T();
  $("#mannerSteps").innerHTML = t.manner.map(m=>
    `<li><b>${esc(m.b)}</b><span>${esc(m.s)}</span></li>`).join("");
  $("#mannerNg").innerHTML =
    `<div class="card"><h2>${esc(t.ngTitle)}</h2>
       <div class="chips">${t.ng.map(x=>`<span class="chip warn">${esc(x)}</span>`).join("")}</div>
     </div>`;
}

/* ---- 館内案内 ---- */
function renderInfo(){
  const t=T();
  $("#infoQa").innerHTML = t.qa.map(x=>
    `<details class="qa"><summary>${esc(x.q)}</summary><div class="ans">${esc(x.a)}</div></details>`).join("");
}

/* ---- 条件 ---- */
function renderConds(){
  const t=T();
  $("#conds").innerHTML = CONDITIONS.map(c=>
    `<button class="cond" data-cond="${c.id}" aria-pressed="${picked.has(c.id)}">${esc(t.condNames[c.id])}</button>`
  ).join("");
}

/* ---- 全描画 ---- */
function render(){
  const t=T();
  document.documentElement.lang = lang;
  document.title = t.title + " — " + (lang==="ja"?"多言語コンシェルジュ（デモ）":"Onsen Concierge (demo)");

  $("#demoBadge").textContent = t.badge;
  $("#demoNote").textContent  = t.demoNote;
  $("#hTitle").textContent    = t.title;
  $("#hSub").textContent      = t.sub;
  $("#homeLead").textContent  = t.homeLead;
  $("#homeDisc").textContent  = t.homeDisc;

  $$("[data-t]").forEach(el=>{ const v=t[el.dataset.t]; if(typeof v==="string") el.textContent=v; });
  if(scanned) $("#btnScan").textContent = t.scanAgain;

  $("#tiles").innerHTML = t.tiles.map(x=>
    `<button class="tile" data-go="${x.k}">
       <span class="ic">${x.ic}</span>
       <span class="t">${esc(x.t)}</span>
       <span class="d">${esc(x.d)}</span>
     </button>`).join("");

  $("#nav").innerHTML =
    [["home","⌂"],["me","◎"],["info","○"]].map(([k,ic],i)=>
      `<button data-go="${k}" aria-pressed="${false}">
         <span class="ni">${ic}</span><span>${esc(t.nav[i])}</span></button>`).join("");

  $("#foot").innerHTML = t.foot;

  renderBoard(); renderTattoo(); renderManner(); renderInfo(); renderConds();
  if(scanned) renderResult(); else $("#scanResult").innerHTML="";

  const cur = ($$(".screen").find(s=>s.classList.contains("on"))||{id:"s-home"}).id.slice(2);
  $$("#nav button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.go===cur));
}

/* ---- イベント（委譲）---- */
document.addEventListener("click", e=>{
  const lg = e.target.closest("[data-lang]");
  if(lg){ lang = lg.dataset.lang; buildLangs(); render(); return; }

  const g = e.target.closest("[data-go]");
  if(g){ go(g.dataset.go); return; }

  const c = e.target.closest("[data-cond]");
  if(c){
    const id=c.dataset.cond;
    picked.has(id) ? picked.delete(id) : picked.add(id);
    c.setAttribute("aria-pressed", picked.has(id));
    if(scanned) renderResult();
    return;
  }

  if(e.target.closest("#btnScan")){ runScan(); }
});

/* 埋め込み時に施設名・初期言語を差し替える（widget.js が ?inn= ?lang= を渡す）。
   textContent 経由でしか描画しないので、値のエスケープは不要。 */
(function(){
  var qp = new URLSearchParams(location.search);
  var qLang = qp.get("lang"), qInn = qp.get("inn");
  if (qLang && I18N[qLang]) lang = qLang;
  if (qInn) Object.keys(I18N).forEach(function(k){ I18N[k].title = qInn; });  // 宿名は固有名詞
})();

buildLangs();
render();
go("home");
</script>
